#:schema node_modules/wrangler/config-schema.json
name = "primeprop-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "primeprop-db"
database_id = "162aa04a-f169-43ea-a336-4365350dda4a"

# R2 Bucket
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "primeprop-images"

# Environment variables (secrets set via `wrangler secret put`)
[vars]
ENVIRONMENT = "production"
# Note: JWT_SECRET is set via `wrangler secret put JWT_SECRET` — NOT stored here for security

# Static assets
[assets]
directory = "../"
