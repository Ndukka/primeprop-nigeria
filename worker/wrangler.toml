#:schema node_modules/wrangler/config-schema.json
name = "primeprop-worker"
main = "src/production-entry.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "primeprop-db"
database_id = "162aa04a-f169-43ea-a336-4365350dda4a"

# R2 Bucket
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "primeprop-images"

# Non-secret environment variables
[vars]
ENVIRONMENT = "production"
PUBLIC_APP_URL = "https://primeprop-worker.ndupsn.workers.dev"
# Configure the verified sender before enabling password recovery:
# PASSWORD_RESET_FROM = "PrimeProp Nigeria <security@primeprop.ng>"
#
# Secrets must be configured through Wrangler or Cloudflare Secrets Store:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put GOOGLE_REDIRECT_URI
# Never place secret values in this file.

# Durable Objects for rate limiting
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# public/ is source. npm run build:public produces the only deployable bundle.
# Local CSS and JavaScript are content-hashed and every page uses root-absolute
# URLs, preventing normal navigation from mixing HTML and assets from different
# Worker revisions.
[assets]
binding = "ASSETS"
directory = "../dist-public"
not_found_handling = "none"
html_handling = "drop-trailing-slash"
run_worker_first = true
