#:schema node_modules/wrangler/config-schema.json
name = "primeprop-worker"
main = "src/production-entry.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "primeprop-db"
database_id = "162aa04a-f169-43ea-a336-4365350dda4a"

# R2 Bucket
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "primeprop-images"

# Non-secret environment variables
[vars]
ENVIRONMENT = "production"
PUBLIC_APP_URL = "https://primeprop-worker.ndupsn.workers.dev"
# Configure the verified sender before enabling password recovery:
# PASSWORD_RESET_FROM = "PrimeProp Nigeria <security@primeprop.ng>"
#
# Secrets must be configured through Wrangler or Cloudflare Secrets Store:
#   node ./scripts/run-wrangler.mjs secret put JWT_SECRET
#   node ./scripts/run-wrangler.mjs secret put RESEND_API_KEY
#   node ./scripts/run-wrangler.mjs secret put GOOGLE_CLIENT_ID
#   node ./scripts/run-wrangler.mjs secret put GOOGLE_CLIENT_SECRET
#   node ./scripts/run-wrangler.mjs secret put GOOGLE_REDIRECT_URI
#   node ./scripts/run-wrangler.mjs secret put GOOGLE_FEEDBACK_REDIRECT_URI
#
# GOOGLE_FEEDBACK_REDIRECT_URI must be exactly:
# https://primeprop-worker.ndupsn.workers.dev/auth/feedback/google/callback
# Never place secret values in this file.

# Durable Objects for rate limiting
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# public/ is source. npm run build:public produces the only deployable bundle.
# HTML and dynamic routes still run through the Worker for nonce injection,
# authentication, API handling, redirects, and security headers. Generated
# content-hashed files under /assets/ are immutable and can be served directly
# by Static Assets without consuming a Worker request for every CSS/JS fetch.
[assets]
binding = "ASSETS"
directory = "../dist-public"
not_found_handling = "none"
html_handling = "drop-trailing-slash"
run_worker_first = ["/*", "!/assets/*"]
