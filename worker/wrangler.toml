#:schema node_modules/wrangler/config-schema.json
name = "primeprop-worker"
main = "src/hardened-entry.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "primeprop-db"
database_id = "162aa04a-f169-43ea-a336-4365350dda4a"

# R2 Bucket
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "primeprop-images"

# Non-secret environment variables
[vars]
ENVIRONMENT = "production"
# Configure these deployment-specific values before enabling password recovery:
# PUBLIC_APP_URL = "https://primeprop.ng"
# PASSWORD_RESET_FROM = "PrimeProp Nigeria <security@primeprop.ng>"
#
# Secrets must be configured through Wrangler or Cloudflare Secrets Store:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put RESEND_API_KEY
# Never place secret values in this file.

# Durable Objects for rate limiting
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Worker-first delivery lets the application inject a fresh CSP nonce into HTML
# while serving all public files from the dedicated public/ directory.
[assets]
binding = "ASSETS"
directory = "../public"
not_found_handling = "none"
run_worker_first = true
