#:schema node_modules/wrangler/config-schema.json
name = "primeprop-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "primeprop-db"
database_id = "162aa04a-f169-43ea-a336-4365350dda4a"

# R2 Bucket
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "primeprop-images"

# Environment variables
[vars]
ENVIRONMENT = "production"
# JWT_SECRET is set via `wrangler secret put JWT_SECRET` — NEVER committed to Git

# Durable Objects for rate limiting
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# run_worker_first=true: Worker intercepts all requests, applies nonce CSP to HTML.
# ASSETS.fetch() inside Worker bypasses the Worker — no loop risk.
[assets]
binding = "ASSETS"
directory = "../public"
not_found_handling = "none"
run_worker_first = true
