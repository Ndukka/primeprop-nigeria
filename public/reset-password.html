<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password — PrimeProp Nigeria</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      font-family: Inter, sans-serif;
    }
    .reset-card {
      width: min(100%, 440px);
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }
    .reset-card h1 { margin: 0 0 8px; color: #0f172a; font-size: 1.6rem; }
    .reset-card p { color: #64748b; line-height: 1.55; }
    .reset-form { display: grid; gap: 16px; margin-top: 24px; }
    .reset-form label { display: grid; gap: 7px; color: #334155; font-weight: 600; }
    .reset-form input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font: inherit;
    }
    .reset-form input:focus { outline: 3px solid rgba(37, 99, 235, 0.18); border-color: #2563eb; }
    .reset-form button { width: 100%; }
    .reset-message { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; }
    .reset-message.is-visible { display: block; }
    .reset-message.is-error { color: #991b1b; background: #fee2e2; }
    .reset-message.is-success { color: #166534; background: #dcfce7; }
    .reset-links { margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <main class="reset-card">
    <a href="/" class="logo" aria-label="PrimeProp Nigeria home">
      <span class="logo-icon"><i class="fa-solid fa-building"></i></span>
      <span class="logo-text"><span class="prime">PrimeProp</span> <span class="ng">Nigeria</span></span>
    </a>

    <h1>Choose a new password</h1>
    <p>The reset link can be used once and expires after 15 minutes.</p>

    <form id="resetForm" class="reset-form" novalidate>
      <label>
        New password
        <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      </label>
      <label>
        Confirm new password
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      </label>
      <button id="submitButton" class="btn btn-primary" type="submit">Reset password</button>
    </form>

    <div id="message" class="reset-message" role="status" aria-live="polite"></div>

    <p class="reset-links"><a href="/login.html">Return to sign in</a></p>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      const form = document.getElementById('resetForm');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const submitButton = document.getElementById('submitButton');
      const message = document.getElementById('message');

      // Remove the token from the visible URL and browser history immediately.
      window.history.replaceState({}, document.title, window.location.pathname);

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `reset-message is-visible ${type === 'success' ? 'is-success' : 'is-error'}`;
      }

      if (!token) {
        form.hidden = true;
        showMessage('This reset link is missing its token. Request a new password reset link.', 'error');
        return;
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();

        if (password.value !== confirmPassword.value) {
          showMessage('The passwords do not match.', 'error');
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Resetting password…';

        try {
          const response = await fetch('/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: password.value }),
          });
          const body = await response.json().catch(() => ({}));

          if (!response.ok || !body.success) {
            showMessage(body.message || 'The link is invalid or has expired.', 'error');
            return;
          }

          form.reset();
          form.hidden = true;
          showMessage('Your password has been reset. You can now sign in.', 'success');
        } catch {
          showMessage('The password could not be reset. Check your connection and try again.', 'error');
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Reset password';
        }
      });
    })();
  </script>
</body>
</html>
